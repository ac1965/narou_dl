[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narou-dl"
version = "1.4.0"
description = "小説家になろうの作品をダウンロードしてEPUB(縦書き/横書き、章立て・ルビ・挿絵・キャッシュ対応)に変換するツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "ebooklib>=0.18",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
gui = [
    "PySide6>=6.5",
]

[project.scripts]
narou-dl = "narou_dl.cli:main"

[project.gui-scripts]
narou-dl-gui = "narou_dl.gui.app:main"

[tool.setuptools]
packages = ["narou_dl", "narou_dl.gui"]
