[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narou-dl"
version = "1.4.0"
description = "小説家になろうの作品をダウンロードしてEPUB(縦書き/横書き、章立て・ルビ・挿絵・キャッシュ対応)に変換するツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "ebooklib>=0.18",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "narou-dl[pdf]",
]
gui = [
    "PySide6>=6.5",
]
pdf = [
    "playwright>=1.40",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "lxml>=4.9",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
narou-dl = "narou_dl.cli:main"

[project.gui-scripts]
narou-dl-gui = "narou_dl.gui.app:main"

[tool.setuptools]
packages = ["narou_dl", "narou_dl.gui"]

[tool.pytest.ini_options]
filterwarnings = [
    # pdf_builder.py はEPUB内のXHTMLを意図的にHTMLパーサ(lxml)で寛容に
    # 解析している(現実のEPUBの軽微なXHTML違反にも耐えるため)。bs4は
    # これに対し毎回警告するが、想定通りの動作なので抑制する。
    "ignore::bs4.XMLParsedAsHTMLWarning",
]
